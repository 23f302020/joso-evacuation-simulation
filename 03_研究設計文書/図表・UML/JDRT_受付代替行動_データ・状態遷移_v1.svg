<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-label="公開根拠と旧物理入力を別系列へ結合し、要求受付と乗車、未乗車時の徒歩代替を分ける図"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#405d6f"/></marker></defs><g fill="none" stroke="#405d6f" stroke-width="2" marker-end="url(#a)"><path d="M245 65H310"/><path d="M550 65H620"/><path d="M860 65H930"/><path d="M435 105V155H165V205"/><path d="M265 245H325"/><path d="M505 245H565"/><path d="M745 245H805"/><path d="M415 285V345H565"/><path d="M745 345H805"/></g><g font-family="system-ui,sans-serif" text-anchor="middle" font-size="16"><g fill="#e4edf2" stroke="#879dab"><rect x="15" y="25" width="230" height="80" rx="8"/><rect x="310" y="25" width="240" height="80" rx="8"/><rect x="620" y="25" width="240" height="80" rx="8"/><rect x="930" y="25" width="175" height="80" rx="8"/></g><g fill="#203746"><text x="130" y="58">旧物理入力・全人物</text><text x="130" y="83">SHA一致でコピー</text><text x="430" y="58">新PAP・Registry</text><text x="430" y="83">D0/D1・5%/50%</text><text x="740" y="58">新CLI / 独立検証</text><text x="740" y="83">実SUMO・全14smoke</text><text x="1017" y="58">READY後70セル</text><text x="1017" y="83">1セル / 15分監視</text></g><g fill="#e3f1eb" stroke="#6f9687"><rect x="65" y="205" width="200" height="80" rx="8"/><rect x="325" y="205" width="180" height="80" rx="8"/><rect x="565" y="205" width="180" height="80" rx="8"/><rect x="805" y="205" width="280" height="80" rx="8"/></g><g fill="#203746"><text x="165" y="238">準備完了 → 要求受付</text><text x="165" y="263">意思 ≠ 配車受理</text><text x="415" y="238">pending / 迎車中</text><text x="415" y="263">未乗車期限を監査</text><text x="655" y="238">期限前の乗車開始</text><text x="655" y="263">300秒乗車処理</text><text x="945" y="238">輸送 → 降車処理 → 終点</text><text x="945" y="263">施設受入・満員・退出を分離</text></g><rect x="565" y="310" width="180" height="70" rx="8" fill="#fff0db" stroke="#bc9360"/><rect x="805" y="310" width="280" height="70" rx="8" fill="#fff0db" stroke="#bc9360"/><g fill="#563d1e"><text x="655" y="338">未乗車取消</text><text x="655" y="363">同originから徒歩1回</text><text x="945" y="338">現在の経路/閉鎖/距離を検査</text><text x="945" y="363">不能も分母へ保持</text></g><text x="300" y="336" fill="#563d1e">期限到達 / 迎車車両失敗</text><text x="560" y="414" fill="#405d6f">乗車開始後は原点への回帰なし。取消車両は実位置から待機へ。技術未READY。</text></g></svg>
