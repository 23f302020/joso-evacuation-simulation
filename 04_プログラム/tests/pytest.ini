[pytest]
# 河川氾濫時避難シミュレーション テスト設定
# 詳細は tests/テスト設計書.md を参照

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 既定でSUMO実行(@slow)は除外。含める場合は: pytest -m "slow or not slow"
addopts = -ra --strict-markers -m "not slow"

markers =
    slow: SUMO/TraCI起動を伴う重いテスト（既定で除外）
    regression: pytest-regressions によるgolden fileテスト
    smoke: 例外なく走ることのみ確認するスモークテスト

# osmnx / geopandas / shapely の非重要な警告を抑制（テスト出力を読みやすく）
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:geopandas.*
    ignore::FutureWarning:pandas.*
